name: Build sing-box rules (high quality)

on:
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * 5"
  push:
    branches:
      - master
    paths-ignore:
      - "**/README.md"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ===== 变量 =====
      - name: Set variables
        run: |
          echo "BUILDTIME=$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')" >> $GITHUB_ENV
          echo "CHINA_DOMAINS_URL=https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/ChinaMax/ChinaMax_Domain.txt" >> $GITHUB_ENV
          echo "GOOGLE_DOMAINS_URL=https://raw.githubusercontent.com/felixonmars/dnsmasq-china-list/master/google.china.conf" >> $GITHUB_ENV
          echo "APPLE_DOMAINS_URL=https://raw.githubusercontent.com/felixonmars/dnsmasq-china-list/master/apple.china.conf" >> $GITHUB_ENV
          echo "CUSTOM_PROXY=https://raw.githubusercontent.com/Loyalsoldier/domain-list-custom/release/geolocation-!cn.txt" >> $GITHUB_ENV

      # ===== 仓库 =====
      - uses: actions/checkout@v4
        with:
          repository: MetaCubeX/meta-rules-dat

      - uses: actions/checkout@v4
        with:
          repository: Loyalsoldier/domain-list-custom
          path: custom

      - uses: actions/checkout@v4
        with:
          repository: v2fly/domain-list-community
          path: community

      - uses: actions/checkout@v4
        with:
          repository: MetaCubeX/meta-rules-converter
          path: convert

      - uses: actions/checkout@v4
        with:
          repository: cokebar/gfwlist2dnsmasq
          path: gfwlist2dnsmasq

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # ===== GFWList =====
      - name: Generate GFWList domains
        run: |
          cd gfwlist2dnsmasq
          chmod +x ./gfwlist2dnsmasq.sh
          ./gfwlist2dnsmasq.sh -l -o ./temp-gfwlist.txt

      # ===== direct =====
      - name: Build direct list
        run: |
          curl -sSL ${CHINA_DOMAINS_URL} | sed '/^\s*#/d' | sed '/^[^\.]/ s/^/full:/' > temp-direct.txt

      # ===== proxy =====
      - name: Build proxy list
        run: |
          cat ./gfwlist2dnsmasq/temp-gfwlist.txt | perl -ne '/^((?=^.{3,255})[a-zA-Z0-9][-_a-zA-Z0-9]{0,62}(\.[a-zA-Z0-9][-_a-zA-Z0-9]{0,62})+)/ && print "$1\n"' > temp-proxy.txt
          curl -sSL $GOOGLE_DOMAINS_URL | perl -ne '/^server=\/([^\/]+)\// && print "$1\n"' >> temp-proxy.txt
          curl -sSL $APPLE_DOMAINS_URL | perl -ne '/^server=\/([^\/]+)\// && print "$1\n"' >> temp-proxy.txt
          curl -sSL ${CUSTOM_PROXY} | grep -Ev ":@cn" | perl -ne '/^(domain):([^:]+)(\n$|:@.+)/ && print "$2\n"' >> temp-proxy.txt

      # ===== reserve 规则 =====
      - name: Reserve rules
        run: |
          curl -sSL ${CUSTOM_PROXY} | grep -Ev ":@cn" | perl -ne '/^((full|regexp|keyword):[^:]+)(\n$|:@.+)/ && print "$1\n"' | sort -u > proxy-reserve.txt

      # ===== hidden =====
      - name: Add hidden rules
        run: |
          cat ./resouces/proxy.txt >> temp-proxy.txt
          cat ./resouces/direct.txt >> temp-direct.txt

      # ===== 排序 =====
      - name: Sort lists
        run: |
          sort -u temp-proxy.txt > proxy-list-with-redundant
          sort -u temp-direct.txt > direct-list-with-redundant

      # ===== 去重核心 =====
      - name: Remove redundant domains
        run: |
          chmod +x ./resouces/*.py

          python ./resouces/findRedundantDomain.py \
            ./direct-list-with-redundant \
            ./direct-list-deleted-unsort

          python ./resouces/findRedundantDomain.py \
            ./proxy-list-with-redundant \
            ./proxy-list-deleted-unsort

          [ ! -f "direct-list-deleted-unsort" ] && touch direct-list-deleted-unsort
          [ ! -f "proxy-list-deleted-unsort" ] && touch proxy-list-deleted-unsort

          sort ./direct-list-deleted-unsort > ./direct-list-deleted-sort
          sort ./proxy-list-deleted-unsort > ./proxy-list-deleted-sort

          python ./resouces/removeFrom.py \
            -remove ./direct-list-deleted-sort \
            -from ./direct-list-with-redundant \
            -out direct-list-without-redundant

          python ./resouces/removeFrom.py \
            -remove ./proxy-list-deleted-sort \
            -from ./proxy-list-with-redundant \
            -out proxy-list-without-redundant

      # ===== need-to-remove =====
      - name: Remove unwanted domains
        run: |
          python ./resouces/removeFrom.py \
            -remove ./resouces/direct-need-to-remove.txt \
            -from ./direct-list-without-redundant \
            -out temp-cn.txt

          python ./resouces/removeFrom.py \
            -remove ./resouces/proxy-need-to-remove.txt \
            -from ./proxy-list-without-redundant \
            -out temp-geolocation-\!cn.txt

      # ===== 写入 community =====
      - name: Write to community data
        run: |
          mkdir -p community/data

          cat temp-cn.txt | sort -u > community/data/cn
          cat temp-geolocation-\!cn.txt | grep -v "\.cn$" | sort -u > community/data/geolocation-\!cn

          [ -f "proxy-reserve.txt" ] && cat proxy-reserve.txt >> community/data/geolocation-\!cn

      # ===== 构建 geosite =====
      - name: Build geosite.dat
        run: |
          cd custom
          go run ./ --datapath=../community/data

      # ===== geoip =====
      - name: Get geoip.dat
        run: |
          wget https://github.com/Loyalsoldier/geoip/raw/release/geoip.dat

      # ===== 转 sing =====
      - name: Convert to sing-box
        run: |
          mkdir -p sing-rule/geosite
          mkdir -p sing-rule/geoip

          cd convert

          go run ./ geosite \
            -f ../custom/publish/geosite.dat \
            -o ../sing-rule/geosite \
            -t sing-box

          go run ./ geoip \
            -f ../geoip.dat \
            -o ../sing-rule/geoip \
            -t sing-box

      # ===== 推送 =====
      - name: Push to sing branch
        run: |
          cd sing-rule
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b sing
          git add .
          git commit -m "High-quality sing rules ${{ env.BUILDTIME }}"

          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f origin sing
